# OptArena benchmark manifest (KernelBench port).
name: gemm_max_subtract_gelu
func_name: gemm_max_subtract_gelu
kind: microkernel
level: 2
parameters:
  S:
    batch_size: 4
    in_features: 6
    out_features: 8
  M:
    batch_size: 8
    in_features: 12
    out_features: 16
  L:
    batch_size: 16
    in_features: 24
    out_features: 32
  XL:
    batch_size: 32
    in_features: 48
    out_features: 64
init:
  # ``max_dim`` names the axis torch.max reduces over -- a STRUCTURAL choice, not a size. It was
  # declared under ``parameters`` and scaled 1/2/4/8 per preset, which is out of bounds on a rank-2
  # array from M up, and made ``out``'s second extent the axis INDEX.
  scalars:
    max_dim: 1
  arrays:
    x: (batch_size, in_features)
    gemm_weight: (out_features, in_features)
    gemm_bias: (out_features,)
    out: (batch_size, 1)
output_args:
- out
taxonomy:
  track: ml
  subtrack: kernelbench
  domain: Learning
