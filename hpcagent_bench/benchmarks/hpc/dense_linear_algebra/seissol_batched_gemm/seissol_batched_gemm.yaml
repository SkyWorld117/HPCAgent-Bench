# HPCAgent-Bench benchmark manifest -- SeisSol ADER-DG element-local "star" update,
# a tall-skinny batched GEMM Q[b] += I[b] @ star, (M,N,K)=(Nb,9,9) over a batch
# of elements b. ATTRIBUTION: element-local operator of SeisSol's ADER-DG
# seismic-wave solver (github.com/SeisSol/SeisSol; BSD-3-Clause). Batched-tiny-GEMM
# framing from yateto (github.com/ThrudPrimrose/yateto; BSD-3-Clause) + the SeisSol
# code generators gemmforge/TensorForge, and the fused-batched-GEMM paper
# Dorozhinskii, Brito Gadeschi & Bader, Concurrency and Computation: P&E 36(12),
# Article e8037, 2024, doi:10.1002/cpe.8037. Full bibliography in REFERENCES.md.
#
# Shapes are FIXED by the method order (physics): order is pinned to 7 (Nb=84)
# across every size class here -- order is a discrete algorithm/config choice,
# not a size, so it is never scaled by a preset (order 9 would change Nb, hence
# the actual math being benchmarked, not just the amount of it). The S/M/L/XL
# presets scale ONLY the batch (number of elements): 1024 / 16384 / 131072 /
# 524288, i.e. ~12 MB / 190 MB / 1.5 GB / 6 GB of fp64 working set (per element
# = I + Q = 2*Nb*9*8 B ~= 12 KB; the shared 9x9 star is one negligible copy).
name: SeisSol ADER-DG batched star GEMM
short_name: seissol_batched_gemm
kind: microkernel
level: 1
# nb = order*(order+1)*(order+2)//6 (initialize()'s _nb_for_order): the modal
# basis count, NOT affine in order, so it cannot be constant-folded into the
# emitted shape the way NQ is. It is a real ABI symbol -- the C body's own
# loop bound/stride -- so it is declared here per preset. order is pinned to 7
# (hence nb is the same 84 literal) in every size class below -- nb follows
# order exactly like nnz follows M/N in spmv, the same way every other size
# symbol in this file is a curated literal.
parameters:
  S:
    batch: 1024
    order: 7
    nb: 84
  M:
    batch: 16384
    order: 7
    nb: 84
  L:
    batch: 131072
    order: 7
    nb: 84
  XL:
    batch: 524288
    order: 7
    nb: 84
init:
  func_name: initialize
  input_args:
  - batch
  - order
  output_args:
  - Q
  - I
  - star
  # Declared purely so contract.py's ABI derivation sees which parameters are
  # real kernel symbols (batch, nb) vs an initialize()-only knob (order,
  # consumed only to compute nb -- never reaches the kernel body or its C
  # signature).
  shapes:
    I: (batch, nb, 9)
    Q: (batch, nb, 9)
    star: (9, 9)
array_args:
- Q
- I
- star
output_args:
- Q
taxonomy:
  track: hpc
  subtrack: seissol
  dwarf: dense_linear_algebra
  domain: SeismicWave
  scale: micro
  tags:
  - seissol
  - ader_dg
  - batched_gemm
  - small_matrix
