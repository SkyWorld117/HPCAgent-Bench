# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
name: CRC-16
kind: microkernel
level: 2
parameters:
  S:
    N: 1600
    reflect_out: 1
  M:
    N: 16000
    reflect_out: 1
  L:
    N: 1000000
    reflect_out: 1
  XL:
    N: 536870911
    reflect_out: 1
  # reflect_out is a config axis (0/1 toggle for the closing byte swap), drawn
  # independently of N -- see fuzz.configs below. An EXPLICIT 'fuzzed' preset
  # is required here even though N alone would already get a sane range from
  # resolve_ranges's default [L, XL] fallback: that fallback derives its keys
  # from the 'L' preset above, which (like every fixed preset) also carries
  # reflect_out -- without an explicit 'fuzzed' preset restricting the draw to
  # N only, reflect_out would leak in as a FIXED pass-through value and
  # _resolve_sizes would clobber the config-drawn reflect_out back to 1 on
  # every iteration (verified: without this block, sample_params drew
  # reflect_out=1 for all 10 test iterations despite fuzz.configs.valid
  # listing both 0 and 1).
  fuzzed:
    N: [1000000, 536870911]
# Config-parameters -- the discrete config axis, INDEPENDENT of the N size
# draw (see the 'fuzzed' preset comment above for why reflect_out must NOT
# also appear there).
fuzz:
  configs:
    valid:
    - {reflect_out: 0}
    - {reflect_out: 1}
init:
  input_args:
  - N
  output_args:
  - data
  - crc
  dtypes:
    data: int64
    crc: int64
  scalars:
    poly: 4129
    crc_init: 65535
    xorout: 65535
  func_name: initialize
array_args:
- data
- crc
output_args:
- crc
taxonomy:
  track: hpc
  subtrack: crc16
  dwarf: combinational_logic
  domain: Other
  tags:
  - npbench
